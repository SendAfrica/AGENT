version: '3.8'

services:
  sendafrica-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendafrica-agent-webhook
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8099:8099"
    volumes:
      - agent_data:/app/data
    environment:
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=8099
      - AGENT_DB_PATH=/app/data/agent.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  agent_data:
    driver: local
